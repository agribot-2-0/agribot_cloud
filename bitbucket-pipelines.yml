image: docker:18-git

pipelines:
  default:
     - step:
         name: "Check pylint"
         script:
           - apk add --update bash coreutils gcc python3-dev py3-pip musl-dev
           - pip3 install setuptools
           - pip3 install pylint
           - pylint --rcfile=.pylintrc scripts/*

definitions:
  services:
    docker:
      memory: 2048
