image: docker:18-git

pipelines:
  default:
     - step:
         name: "Check pylint"
         script:
           - apk add --update bash coreutils tar python3 py-pip
           - pip install pylint
           - git clone https://github.com/panpawelchmiel/agribot_common.git
           - pylint --rcfile=agribot_common/pylint_conf/.pylintrc scripts/*

definitions:
  services:
    docker:
      memory: 2048
